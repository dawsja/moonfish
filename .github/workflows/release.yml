name: Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: moonfish-host
      - name: cargo-zigbuild (and zig)
        run: pip install cargo-zigbuild==0.24.1 ziglang==0.17.1
      - name: Build
        run: bun scripts/build-host.ts --linux
      - uses: actions/upload-artifact@v4
        with:
          name: moonfish-host-linux
          path: app/src-tauri/host/moonfish-host-*-linux
          if-no-files-found: error

  host-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: moonfish-host-macos
      - name: Build
        run: bun scripts/build-host.ts --darwin
      - uses: actions/upload-artifact@v4
        with:
          name: moonfish-host-macos
          path: app/src-tauri/host/moonfish-host-*-darwin
          if-no-files-found: error

  build:
    needs: [host, host-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      AZURE_SIGNING: ${{ vars.AZURE_SIGNING }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: moonfish-host-*
          merge-multiple: true
          path: app/src-tauri/host
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: .github/scripts/apt-install.sh libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev
      - name: Install
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Windows code signing tool (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.AZURE_SIGNING == 'true' && env.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          cargo install artifact-signing-cli --version 0.12.0 --locked
          st=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe | sort -V | tail -1)
          echo "SIGNTOOL_PATH=$(cygpath -w "$st")" >> "$GITHUB_ENV"
      - name: Build installers and signed updates
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          config=()
          if [ "$RUNNER_OS" = Windows ] && [ "$AZURE_SIGNING" = true ] && [ -n "$AZURE_CLIENT_ID" ]; then
            config+=(--config src-tauri/tauri.windows-sign.conf.json)
            echo "Signing Windows binaries with Azure Artifact Signing"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set: no signed updates in this build"
            config+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          bunx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${config[@]}"
      - name: Collect release files
        working-directory: app
        run: bun scripts/collect.ts --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: moonfish-${{ matrix.target }}
          path: app/release/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: moonfish-*
          merge-multiple: true
          path: app/release
      - name: Manifest (updates + downloads)
        run: bun app/scripts/manifest.ts
      - name: Publish to R2 (dl.moonfish.run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOONFISH_R2_BUCKET: ${{ vars.MOONFISH_R2_BUCKET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping the R2 upload"
            exit 0
          fi
          bash scripts/publish-desktop-r2.sh
      - uses: softprops/action-gh-release@v2
        with:
          name: Moonfish ${{ github.ref_name }}
          files: |
            app/release/moonfish-desktop-*
            app/release/latest.json
