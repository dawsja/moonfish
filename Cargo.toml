[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "phone/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/dawsja/moonfish"

[workspace.dependencies]
moonfish-core = { path = "crates/moonfish-core" }
moonfish-transport = { path = "crates/moonfish-transport" }
moonfish-agents = { path = "crates/moonfish-agents" }
moonfish-git = { path = "crates/moonfish-git" }
moonfish-remote = { path = "crates/moonfish-remote" }
moonfish-host = { path = "crates/moonfish-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
