[package]
name = "moonfish-host"
description = "Moonfish: the helper Moonfish puts on an SSH host, so agents keep running through dropped connections"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "moonfish_host"
path = "src/lib.rs"

[[bin]]
name = "moonfish-host"
path = "src/main.rs"

# Nothing but std and libc: the binary is built static (musl on Linux, native on macOS) and copied to the host.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
moonfish-core.workspace = true
moonfish-transport.workspace = true
