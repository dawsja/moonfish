[package]
name = "moonfish-phone"
description = "Moonfish for phones: pair with the Moonfish desktop app and continue its chats on the phone"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "moonfish_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
moonfish-remote.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "rt"] }
